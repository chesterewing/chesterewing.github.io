<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maskable PWA icon — Chester Ewing Columna
  Same mark as logo-mark.svg, but the glyph is scaled to sit inside the inner
  80% safe zone and the background bleeds to the full square, so Android can
  crop this to a circle, squircle or rounded square without clipping the mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Chester Ewing Columna">
  <rect width="32" height="32" fill="#0b0e10"/>
  <g transform="translate(16 16) scale(0.74) translate(-16 -16)">
    <path d="M20.5 10.64A7 7 0 1 0 20.5 21.36"
          fill="none" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24.2" cy="16" r="2.3" fill="#2dd4bf"/>
  </g>
</svg>
